name: Exact proof replay
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: ers-research verify --controls
      - run: ers-research sections
      - run: python -m unittest discover -s tests -p test_certificates.py -v
      - run: python -m unittest discover -s tests -p test_research.py -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build tools/parameter_sieve/ParameterSieve.csproj -c Release --nologo
      - run: python -m unittest discover -s tests -p test_parameter_sieve.py -v
